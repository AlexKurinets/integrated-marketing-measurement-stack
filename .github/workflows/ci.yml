name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imms
          POSTGRES_PASSWORD: imms
          POSTGRES_DB: imms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imms -d imms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://imms:imms@localhost:5432/imms
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --durations=5

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up
        run: docker compose up --build -d
      - name: Wait for the refresh to publish and the API to answer
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health 2>/dev/null | grep -q '"latest_run": *"run-'; then
              echo "API up after about $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "API did not come up"; docker compose ps; docker compose logs refresh; exit 1
      - name: Smoke the API and the MCP endpoint
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/runs/latest/reconciliation | head -c 600; echo
          curl -fsS http://localhost:8000/runs/latest/explain | head -c 600; echo
          curl -fsS -o /dev/null -w "mcp %{http_code}\n" -X POST http://localhost:8001/mcp \
            -H "content-type: application/json" -H "accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
